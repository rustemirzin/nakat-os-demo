function renderLeads(){const all=state.leads.filter(l=>scoped(l.pointId)),ls=all.filter(l=>(!ui.filter||l.status===ui.filter)&&(!ui.leadSource||l.source===ui.leadSource)&&(!ui.leadType||l.type===ui.leadType)&&(!ui.leadOwner||l.responsibleId===ui.leadOwner)&&(!ui.search||`${l.name} ${l.phone} ${l.source} ${pname(l.pointId)} ${employee(l.responsibleId)?.name||''}`.toLowerCase().includes(ui.search.toLowerCase()))).sort((a,b)=>b.created-a.created),cols=['Обращение','Тип / источник','Точка','Ответственный','Статус'];if(!LEAD_STAGES.includes(ui.leadMobileStage))ui.leadMobileStage='new';const kanban=ui.leadView!=='list';return head('Воронка обращений','CRM · от первого контакта до реального заказа',btn('Заявка с Авито','avito','','','plus')+btn('Создать лид','new-lead','','primary','plus')).replace('class="page-head"','class="page-head crm-head"')+`<div class="crm-overview"><div><span class="kicker">ВЫБРАННАЯ ОБЛАСТЬ</span><strong>${all.length} обращений</strong><span class="muted small">${scopeLabel()}</span></div><div class="crm-stage-summary">${LEAD_STAGES.map(st=>`<button data-action="filter" data-value="${st}" class="${ui.filter===st?'selected':''}"><span class="stage-dot ${st}"></span>${STATUS[st][0]}<b>${all.filter(l=>l.status===st).length}</b></button>`).join('')}</div></div><div class="filters crm-filters"><div class="search">${ico('search',18)}<input id="list-search" aria-label="Поиск лидов" placeholder="Клиент, контакт или точка" value="${esc(ui.search)}"></div><div class="crm-filter-fields ${ui.leadFiltersOpen?'open':''}"><select id="lead-source" aria-label="Источник лидов"><option value="">Все источники</option>${SOURCES.map(src=>`<option ${ui.leadSource===src?'selected':''}>${src}</option>`).join('')}</select><select id="lead-type" aria-label="Тип обращения"><option value="">Аренда и ремонт</option>${['Аренда','Ремонт'].map(t=>`<option ${ui.leadType===t?'selected':''}>${t}</option>`).join('')}</select><select id="lead-owner" aria-label="Ответственный за лид"> ost'?'Сохраняйте причины потери':'Перенесите карточку или создайте лид'}</span></div>`}</div></section>`}).join('')}</div>${!ls.length&&all.length?`<div class="notice" style="margin-top:16px">По этим фильтрам обращений не найдено. ${btn('Показать все','lead-clear','','ghost')}</div>`:''}`:`<div class="card">${ls.length?table(cols,ls.map(l=>tr(cols,[`<strong>${esc(l.name)}</strong><div class="muted">${date(l.created)}</div>`,`${l.type}<div class="muted">${l.source}</div>`,esc(pname(l.pointId)),esc(employee(l.responsibleId)?.name||'Не назначен'),badge(l.status)],'lead',l.id))):empty('Обращений не найдено','Измените фильтры или создайте заявку')}</div>`}<div class="card" style="margin-top:24px"><h2>Источники обращений</h2><p class="muted small" style="margin:6px 0 15px">Все лиды выбранной области. Конверсия = оформленные обращения / все лиды источника. Расходы на рекламу не заданы.</p>${table(['Источник','Лиды','Оформлены','Конверсия'],SOURCES.map(src=>{const a=all.filter(l=>l.source===src),conv=a.filter(l=>l.status==='converted').length;return tr(['Источник','Лиды','Оформлены','Конверсия'],[src,a.length,conv,a.length?Math.round(conv/a.length*100)+'%':'—'],'source-detail',src)}))}</div><p class="muted small" style="margin-top:15px">Интеграции с Авито и сайтом демонстрационные; заявка создаётся только внутри этого файла.</p>`}
function recordLeadStage(l,status,note=''){const previous=l.status;l.status=status;if(status!=='lost')l.reason='';(l.history||=[]).push({time:now(),text:`${STATUS[previous][0]} → ${STATUS[status][0]}${note?' · '+note:''}`});log('Лид '+l.id+': '+STATUS[status][0],l.pointId)}
function moveLead(id,target){const l=get('leads',id);try{if(!l)throw Error('Лид не найден');requireCap('leads',l.pointId);if(!scoped(l.pointId))throw Error('Лид вне выбранной области');if(!LEAD_STAGES.includes(target))throw Error('Неизвестный этап');if(l.status===target)return;if(l.status==='converted')throw Error('Лид уже связан с заказом. Измените заказ в его карточке');if(target==='converted'){if(l.type==='Аренда'){requireCap('rentals',l.pointId);const sc=state.scooters.find(s=>s.status==='available'&&s.pointId===l.pointId);if(!sc)throw Error('В точке лида нет доступной техники. Выберите другую заявку или пополните парк');startCheckout(sc.modelId,{pointId:l.pointId,leadId:l.id});toast('Оформите и оплатите бронь — лид перейдёт в «Оформлен»')}else{requireCap('repairs',l.pointId);openForm('repair',{lead:l.id});toast('Сохраните внешний ремонт — лид перейдёт в «Оформлен»')}return}if(target==='lost'){openForm('lead-lost',{id});return}if(transact('leads',l.pointId,()=>recordLeadStage(l,target))){ui.leadMobileStage=target;render();toast('Лид перемещён: '+STATUS[target][0])}}catch(e){toast(e.message,true)}finally{const control=document.querySelector(`[data-lead-stage="${id}"]`);if(control)control.value=get('leads',id)?.status||'new'}}

function renderFinance(){const f=finances(),entries=f.entries.filter(e=>!ui.direction||e.type===ui.direction);return head('Финансы','Сначала смысл денег, затем сумма',btn('Добавить расход','new-expense','','primary','plus'))+`<div class="notice" style="margin-bottom:22px">Упрощённая управленческая модель, а не бухгалтерская отчётность. Аренда начисляется за полные оказанные дни, включая просрочку до возврата; внешний ремонт — при готовности. Депозит не является выручкой.</div><div class="grid g4">${metric('Выручка от аренды',rub(f.rent),'Начисление по оказанным дням','finance-detail','data-type="rent"',true)}${metric('Внешний сервис',rub(f.repair),'Заказы со статусом «Готов» и «Закрыт»','finance-detail','data-type="repair"')}${metric('Аксессуары',rub(f.accessory),'Начисление по дням аренды','finance-detail','data-type="accessory"')}${metric('Операционная прибыль',rub(f.profit),'Выручка − детали − расходы','finance-detail','data-type="profit"')}</div><div class="grid g2" style="margin-top:22px"><div class="card"><h2>Денежные потоки за период</h2>${attention('wallet',rub(f.incoming)+' поступлений','Включают обеспечительные депозиты','finance','')}${btn('Детализация поступлений','finance-detail','data-type="cash"','','arrow')}<div class="detail-row"><span>Выплаты и расходы</span><button class="link" data-action="finance-detail" data-type="outgoing">${rub(f.outgoing)}</button></div><div class="detail-row"><span>Чистый поток</span><strong>${rub(f.incoming-f.outgoing)}</strong></div><p class="small muted" style="margin-top:13px">Расходы считаются оплаченными в дату записи. Начальные запасы оплачены до периода. Новое поступление имитирует закупку; списание детали не дублирует выплату.</p></div><div class="card"><h2>Депозиты отдельно</h2><div class="price" style="margin:15px 0">${rub(f.deposits)}</div><p class="muted small">Остаток обязательств по всем датам в выбранной области. Полученные депозиты минус возвраты и удержания.</p>${btn('Операции с депозитами','finance-detail','data-type="deposit"','','arrow')}<div class="detail-row"><span>Покупка техники в периоде</span><button class="link" data-action="finance-detail" data-type="capital">${rub(f.capital)}</button></div><p class="muted small">Покупка парка — капитальные затраты, не полный расход операционной прибыли.</p></div></div><div class="card" style="margin-top:22px"><h2>Операционные расходы по категориям</h2><div class="detail-row"><span>Использованные запчасти</span><button class="link" data-action="finance-detail" data-type="parts">${rub(f.parts)}</button></div>${["Зарплата","Аренда помещения","Прочие расходы"].map(cat=>`<div class="detail-row"><span>${cat}</span><button class="link" data-action="finance-detail" data-type="expense:${cat}">${rub(-sum(f.entries.filter(e=>e.type==="expense"&&e.category===cat),e=>e.amount))}</button></div>`).join("")}</div><div class="section-caption"><h2>Начисления и расходы</h2><select id="direction-filter" aria-label="Направление финансов"><option value="">Все направления</option>${[['rent','Аренда'],['repair','Внешний сервис'],['accessory','Аксессуары'],['parts','Запчасти'],['expense','Расходы'],['capital','Покупка техники']].map(([id,n])=>`<option value="${id}" ${ui.direction===id?'selected':''}>${n}</option>`).join('')}</select></div><div class="card">${entries.length?financeTable(entries):empty('За период операций нет','Добавьте расход или выберите другой период')}</div><div class="notice" style="margin-top:20px">Внутренний ремонт не создаёт выручку. Детали относятся в расходы при списании один раз. Зарплата внутренних механиков учтена в расходах точки; стоимость работ внутреннего заказа повторно её не увеличивает.</div>`}

function shiftPreview(form){if(!form)return;const {values}=shiftRead(form),errors=shiftChecks(values);const box=form.querySelector('#shift-form-check');if(box){box.classList.toggle('warn',errors.length>0);box.textContent=errors.length?errors.join(' · '):rnpNum(values.total)?'Заполненные значения корректны. Для отправки заполните все поля.':'Введите суммы: проверим наличные, безнал и направления выручки.'}}
function shiftSave(form,intent){if(!allow('shifts'))return toast('Отчёты недоступны в этой роли',true);const {f,values}=shiftRead(form),existing=shiftReports().find(r=>r.id===form.dataset.id),pointId=ui.role==='manager'?'p1':String(f.pointId||''),status=intent==='draft'?'draft':'submitted';if(existing&&!shiftCan(existing))return toast('Отчёт другой точки недоступен',true);if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date||'')||!Number.isFinite(new Date(f.date).getTime())||!String(f.manager||'').trim())return toast('Заполните дату и менеджера',true);if(!point(pointId))return toast('Укажите точку отчёта',true);const errors=shiftChecks(values,status==='submitted'),numericErrors=errors.filter(x=>x.startsWith('Некорректное'));if((status==='submitted'&&errors.length)||numericErrors.length)return toast((status==='submitted'?errors:numericErrors)[0],true);const expected=Number(form.dataset.revision);if((existing?.revision||0)!==expected)return toast('Этот отчёт уже сохранён. Откройте актуальную версию',true);if(shiftReports().some(r=>r.id!==form.dataset.id&&r.pointId===pointId&&r.date===f.date))return toast('За эту дату у точки уже есть отчёт. Отредактируйте его, чтобы избежать двойного учёта',true);if(transact('shifts',pointId,()=>{const old=shiftReports().find(r=>r.id===form.dataset.id),changes=old?SHIFT_FIELDS.filter(([k])=>old.values[k]!==values[k]).map(([,label])=>label):[],r={id:form.dataset.id,date:f.date,manager:String(f.manager).trim(),pointId,status,revision:expected+1,source:old?.source||'Ввод через форму НакатOS',note:String(f.note||'').trim(),values,history:[...(old?.history||[]),{time:now(),text:ROLES[ui.role].name+': '+(status==='draft'?'сохранён черновик':'отправлен отчёт')+(changes.length?' · изменено: '+changes.join(', '):'')}]};if(old)state.shiftReports[state.shiftReports.indexOf(old)]=r;else state.shiftReports.push(r);log('Отчёт за смену '+date(r.date)+' · '+r.manager,pointId)})){drawer={type:'shift-detail',id:form.dataset.id};renderDrawer();toast(status==='draft'?'Черновик сохранён':'Отчёт отправлен руководителю')}}
function shiftAction(el){if(!allow('shifts'))return toast('Раздел недоступен',true);const a=el.dataset.action,id=el.dataset.id;if(a==='shift-kpi')return openDrawer('shift-kpi',id);if(a==='shift-new'){openDrawer('shift-form',uid('shift'));shiftPreview(document.querySelector('[data-form="shift-report"]'));return}if(a==='shift-clear'){ui.shiftFrom='';ui.shiftTo='';ui.shiftStatus='';return render()}if(a==='shift-view'){ui.shiftView=el.dataset.value==='summary'?'summary':'reports';drawer=null;ui.page='shifts';save();render();return}const r=shiftReports().find(x=>x.id===id);if(!r||!shiftCan(r))return toast('Отчёт недоступен',true);if(a==='shift-detail')return openDrawer('shift-detail',id);if(a==='shift-edit'){openDrawer('shift-form',id);shiftPreview(document.querySelector('[data-form="shift-report"]'));return}if(a==='shift-delete'){if(r.status!=='draft'||r.id===SHIFT_SOURCE.id)return;return confirmAction('Удалить черновик?','Этот черновик будет удалён из отчётов в данном браузере.',()=>{if(transact('shifts',r.pointId,()=>{state.shiftReports=shiftReports().filter(x=>x.id!==id)})){drawer=null;modal=null;render();toast('Черновик удалён')}},'Удалить')}if(a==='shift-review'){if(!['owner','director'].includes(ui.role)||r.status!=='submitted')return toast('Проверка доступна руководителю для отправленного отчёта',true);if(transact('shifts',r.pointId,()=>{r.status='reviewed';r.revision++;r.history.push({time:now(),text:ROLES[ui.role].name+': отчёт проверен'})})){toast('Отчёт проверен');renderDrawer()}}}

validate();render();
